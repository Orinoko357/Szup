<VirtualHost *:80>
    ServerName szup.intranet.wods.pl
    Redirect permanent / https://szup.intranet.wods.pl/
</VirtualHost>

<VirtualHost *:443>
    ServerName szup.intranet.wods.pl

    SSLEngine on
    # UWAGA: realne nazwy plików certu na LOCAL-WWW1 mają MYŚLNIKI (nie kropki).
    # Cert wildcard *.intranet.wods.pl pokrywa też szup.intranet.wods.pl.
    SSLCertificateFile    /etc/ssl/certs/intranet.wods.pl-fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/intranet.wods.pl-key-nopass.pem

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"

    # Tożsamość SSO przekazuje WYŁĄCZNIE Apache — nagłówki o tej nazwie przysłane
    # przez przeglądarkę usuwamy, zanim cokolwiek je zobaczy (zawsze aktywne).
    # Wymaga mod_headers (włącza enable-sso.sh / a2enmod headers).
    RequestHeader unset X-Remote-User early
    RequestHeader unset X-SSO-Proxy-Secret early

    # SSO Kerberos — blok <Location "/api/auth/sso-login"> tworzy deploy/enable-sso.sh
    # w osobnym pliku. Brak pliku = SSO wyłączone (zwykłe logowanie działa normalnie).
    IncludeOptional /etc/apache2/szup-sso.conf

    ProxyPass /api/ http://127.0.0.1:8003/api/
    ProxyPassReverse /api/ http://127.0.0.1:8003/api/

    DocumentRoot /var/www/szup.intranet.wods.pl

    <Directory /var/www/szup.intranet.wods.pl>
        Options -Indexes
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>
</VirtualHost>
